name: Windows Build

on: [push, pull_request, workflow_dispatch]

jobs:
  Windows:
    runs-on: windows-2022
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Install Dependencies
        run: |
          ci-scripts\windows\tahoma-install.bat
          choco install ccache
          copy C:\ProgramData\chocolatey\lib\ccache\tools\ccache*\ccache.exe C:\ProgramData\chocolatey\bin\cl.exe
          mkdir %LOCALAPPDATA%\ccache
      - name: Restore cache
        id: restore-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/AppData/Local/ccache
          key: ${{ runner.os }}-refs/heads/master
          restore-keys: |
            ${{ runner.os }}-
      - name: Get CanonSDK
        if: ${{ (github.repository_owner == 'tahoma2d' || github.repository_owner == 'manongjohn') && github.event_name == 'push' }}
        run: |
          curl -H "Authorization: token ${{ secrets.TAHOMA2D_TOKEN }}" -H "Accept:application/octet-stream" -fsSL -o EDSDK_Windows.zip https://api.github.com/repos/tahoma2d/CanonSDK/releases/assets/459223399
          7z x EDSDK_Windows.zip -oEDSDK_Windows
          move EDSDK_Windows\EDSDK\Header thirdparty\canon
          move EDSDK_Windows\EDSDK_64\Dll thirdparty\canon
          move EDSDK_Windows\EDSDK_64\Library thirdparty\canon
      - name: Get 3rd Party Apps
        run: |
          ci-scripts\windows\tahoma-get3rdpartyapps.bat
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Build
        run: |
          ci-scripts\windows\tahoma-build.bat
      - name: Create Package
        run: |
          ci-scripts\windows\tahoma-buildpkg.bat
      - uses: actions/upload-artifact@v7
        with:
          name: DrawnSean2D-portable-win.zip
          path: toonz\build\DrawnSean2D-portable-win.zip
      - uses: actions/upload-artifact@v7
        with:
          name: DrawnSean2D-setup.exe
          path: toonz\build\DrawnSean2D-setup.exe
      - name: Publish Release
        if: ${{ github.repository_owner != 'tahoma2d' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master') }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.6.3-{0}', github.run_number) }}
          commit: ${{ github.sha }}
          artifacts: toonz\build\DrawnSean2D-setup.exe
          artifactContentType: "raw"
          name: DrawnSean2D ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.6.3-{0}', github.run_number) }}
          generateReleaseNotes: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove existing master cache
        if: ${{ steps.restore-cache.outputs.cache-hit == 'true' && github.ref == 'refs/heads/master' }}
        run: gh cache delete ${{ runner.os }}-refs/heads/master
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save cache
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' || github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/AppData/Local/ccache
          key: ${{ runner.os }}-${{ github.ref }}
