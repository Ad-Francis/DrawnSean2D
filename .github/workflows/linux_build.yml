name: Linux Build

on: [workflow_dispatch]

jobs:
  Linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v5
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'
      - name: Use cmake
        run: cmake --version
      - name: Install Dependencies
        run: |
          ci-scripts/linux/tahoma-install.sh
          sudo apt-get install ccache
          mkdir -p /home/runner/.ccache
      - name: Restore cache
        id: restore-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /home/runner/.ccache
          key: ${{ runner.os }}-${{ matrix.compiler }}-refs/heads/master
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-
      - name: Get CanonSDK
        if: ${{ (github.repository_owner == 'tahoma2d' || github.repository_owner == 'manongjohn') && github.event_name == 'push' }}
        run: |
          curl -H "Authorization: token ${{ secrets.TAHOMA2D_TOKEN }}" -H "Accept:application/octet-stream" -fsSL -o EDSDK_Linux.zip https://api.github.com/repos/tahoma2d/CanonSDK/releases/assets/459223430
          unzip EDSDK_Linux.zip -d EDSDK_Linux
          mv EDSDK_Linux/EDSDK/* thirdparty/canon
          chmod 644 thirdparty/canon/Library/x86_64/lib*
      - name: Build ffmpeg
        run: |
          export CC="ccache ${{ matrix.cc }}"
          export CXX="ccache ${{ matrix.cxx }}"
          ci-scripts/linux/tahoma-buildffmpeg.sh
      - name: Build OpenCV
        run: |
          export CC="ccache ${{ matrix.cc }}"
          export CXX="ccache ${{ matrix.cxx }}"
          ci-scripts/linux/tahoma-buildopencv.sh
      - name: Build libmypaint
        run: |
          export CC="ccache ${{ matrix.cc }}"
          export CXX="ccache ${{ matrix.cxx }}"
          ci-scripts/linux/tahoma-buildlibmypaint.sh
      - name: Build libgphoto2
        run: |
          export CC="ccache ${{ matrix.cc }}"
          export CXX="ccache ${{ matrix.cxx }}"
          ci-scripts/linux/tahoma-buildlibgphoto2.sh
      - name: Build
        run: |
          export CC="ccache ${{ matrix.cc }}"
          export CXX="ccache ${{ matrix.cxx }}"
          ci-scripts/linux/tahoma-build.sh
      - name: Get 3rd Party Apps
        run: |
          ci-scripts/linux/tahoma-get3rdpartyapps.sh
      - name: Create Package
        run: |
          ci-scripts/linux/tahoma-buildpkg.sh
          mv toonz/build/Tahoma2D-linux.tar.gz toonz/build/DrawnSean2D-linux-${{ matrix.compiler }}.tar.gz
          mv toonz/build/Tahoma2D-linux.deb toonz/build/DrawnSean2D-linux-${{ matrix.compiler }}.deb
      - uses: actions/upload-artifact@v7
        with:
          name: DrawnSean2D-linux-${{ matrix.compiler }}.tar.gz
          path: toonz/build/DrawnSean2D-linux-${{ matrix.compiler }}.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: DrawnSean2D-linux-${{ matrix.compiler }}.deb
          path: toonz/build/DrawnSean2D-linux-${{ matrix.compiler }}.deb
      - name: Remove existing master cache
        if: ${{ steps.restore-cache.outputs.cache-hit == 'true' && github.ref == 'refs/heads/master' }}
        run: gh cache delete ${{ runner.os }}-${{ matrix.compiler }}-refs/heads/master
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save cache
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' || github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v5
        with:
          path: |
            /home/runner/.ccache
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ github.ref }}
